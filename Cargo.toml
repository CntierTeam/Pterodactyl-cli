[workspace]
resolver = "2"
members = [
    "crates/ptero-protocol",
    "crates/ptero-config",
    "crates/ptero-panel",
    "crates/ptero-wings",
    "crates/ptero-core",
    "crates/ptero-cli",
    "crates/ptero-tui",
    "bin/ptero",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["CntierTeam"]
repository = "https://github.com/CntierTeam/Pterodactyl-cli"

[workspace.dependencies]
ptero-protocol = { path = "crates/ptero-protocol" }
ptero-config = { path = "crates/ptero-config" }
ptero-panel = { path = "crates/ptero-panel" }
ptero-wings = { path = "crates/ptero-wings" }
ptero-core = { path = "crates/ptero-core" }
ptero-cli = { path = "crates/ptero-cli" }
ptero-tui = { path = "crates/ptero-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart", "stream"] }
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.29"
crossterm = "0.28"
directories = "6"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
bytes = "1"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
