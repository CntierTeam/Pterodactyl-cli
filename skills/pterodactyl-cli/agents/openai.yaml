interface:
  display_name: "Pterodactyl CLI"
  short_description: "代跑 ptero：面板服务器/文件/终端"
  default_prompt: "按 $pterodactyl-cli 当操作员：用户要装 ptero、配 Panel URL/Client|App|Remote 密钥、管服务器开关机、文件、Wings 终端、Application/Remote 时，用 shell 直接跑 ptero（优先 CLI + --json），不要只拼命令或 SAMPLE。缺 URL/密钥/服务器 id 再问一句然后继续跑；不回显完整密钥。"
policy:
  allow_implicit_invocation: true
